<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Family Hub" />
  <title>Castor家小管家</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #ffffff; --primary: #2563eb; --text: #1f2937;
      --muted: #6b7280; --border: #e5e7eb; --danger: #dc2626;
      --warn-bg: #fef3c7; --warn-text: #92400e; --ok-bg: #dcfce7; --ok-text: #166534;
      --radius: 14px;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding-bottom: 84px; }
    header {
      background: var(--card); padding: 10px 14px; border-bottom: 1px solid var(--border);
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px;
      position: sticky; top: 0; z-index: 20;
    }
    .header-left { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    header h1 { margin: 0; font-size: 1rem; }
    .sync-badge { font-size: 0.75rem; padding: 3px 9px; border-radius: 999px; background: var(--warn-bg); color: var(--warn-text); white-space: nowrap; }
    .sync-badge.online { background: var(--ok-bg); color: var(--ok-text); }
    .header-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .lang-switch { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .lang-switch button { border: none; background: #fff; padding: 5px 8px; font-size: 0.76rem; cursor: pointer; color: var(--muted); font-weight: 600; }
    .lang-switch button.active { background: var(--primary); color: #fff; }
    .auth-btn { border: 1px solid var(--border); background: #fff; padding: 5px 10px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; font-weight: 600; white-space: nowrap; }
    .auth-btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    main { max-width: 960px; margin: 0 auto; padding: 16px; }
    .card { background: var(--card); border-radius: var(--radius); padding: 16px; border: 1px solid var(--border); margin-bottom: 16px; }
    .card h2 { margin: 0 0 12px 0; font-size: 1.02rem; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .alert-banner {
      background: #fffbeb; border: 1px solid #fcd34d; border-radius: var(--radius);
      padding: 12px 14px; margin-bottom: 16px;
    }
    .alert-banner-title { font-weight: 700; font-size: 0.94rem; color: #92400e; margin-bottom: 6px; }
    .alert-banner-list { list-style: none; margin: 0; padding: 0; }
    .alert-banner-list li {
      padding: 5px 0; border-top: 1px dashed #fde68a; font-size: 0.88rem;
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap; cursor: pointer;
    }
    .alert-banner-list li:first-child { border-top: none; padding-top: 0; }
    .alert-banner-list li:last-child { padding-bottom: 0; }
    .form-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    input, select, textarea { padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 0.95rem; background: #fff; color: var(--text); flex: 1; min-width: 120px; }
    textarea { width: 100%; min-height: 80px; resize: vertical; }
    button.btn { padding: 10px 16px; border: none; border-radius: 10px; font-size: 0.92rem; font-weight: 600; cursor: pointer; background: var(--primary); color: #fff; white-space: nowrap; }
    button.btn.secondary { background: #f3f4f6; color: var(--text); }
    button.btn.danger { background: #fee2e2; color: var(--danger); }
    button.btn.sm { padding: 6px 10px; font-size: 0.8rem; border-radius: 8px; }
    .row-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .ev-check { width: 17px; height: 17px; min-width: 17px; margin: 0; cursor: pointer; flex: none; }
    .combo-wrap, .who-picker-wrap { position: relative; flex: 1.5; min-width: 200px; }
    .who-box { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 10px; background: #fff; min-height: 42px; }
    .who-chip { display: inline-flex; align-items: center; gap: 4px; background: #dbeafe; color: #1e40af; font-size: 0.84rem; font-weight: 600; padding: 3px 8px; border-radius: 999px; }
    .who-chip button { border: none; background: none; color: #1e40af; font-weight: 700; cursor: pointer; padding: 0 2px; }
    .who-input { border: none !important; outline: none; padding: 4px 2px !important; min-width: 80px !important; flex: 1; background: transparent !important; }
    .dropdown-panel { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: #fff; border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); z-index: 40; max-height: 180px; overflow-y: auto; display: none; }
    .dropdown-panel.open { display: block; }
    .dropdown-item { padding: 9px 12px; cursor: pointer; font-size: 0.9rem; display: flex; justify-content: space-between; align-items: center; }
    .dropdown-item:hover { background: #eff6ff; color: var(--primary); }
    .hint { font-size: 0.75rem; color: var(--muted); }
    .list { list-style: none; padding: 0; margin: 0; }
    .list li { padding: 11px 12px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .list li:last-child { border-bottom: none; }
    .item-main { flex: 1; }
    .item-title { font-weight: 600; font-size: 0.96rem; }
    .item-sub { font-size: 0.83rem; color: var(--muted); margin-top: 3px; }
    .done .item-title, .done .trash-date-text { text-decoration: line-through; color: var(--muted); }
    .qty-badge { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #eff6ff; color: #1d4ed8; font-size: 0.8rem; font-weight: 700; margin-left: 6px; }
    .check-label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 0.86rem; font-weight: 600; padding: 4px 8px; border-radius: 8px; background: #f9fafb; border: 1px solid var(--border); white-space: nowrap; }
    .check-label input[type="checkbox"] { width: 17px; height: 17px; min-width: 17px; margin: 0; cursor: pointer; }
    .quota-box { padding: 10px 12px; border-radius: 10px; font-size: 0.88rem; font-weight: 600; margin-bottom: 12px; background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
    .quota-box.warn { background: var(--warn-bg); color: var(--warn-text); border-color: #fcd34d; }
    .quota-box.over { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 0.76rem; font-weight: 600; margin-right: 6px; white-space: nowrap; }
    .tag-today { background: #fee2e2; color: #b91c1c; }
    .tag-tomorrow { background: #fef3c7; color: #b45309; }
    .tag-future { background: #e0e7ff; color: #3730a3; }
    .tag-cat { background: #f3f4f6; color: #374151; }
    .tag-who { background: #dbeafe; color: #1d4ed8; }
    .tag-gcal { background: #dcfce7; color: #166534; }
    .tag-src { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
    .bin-badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 0.78rem; font-weight: 700; white-space: nowrap; }
    .bin-bio { background: #16a34a; color: #ffffff; }
    .bin-gelb { background: #facc15; color: #1f2937; }
    .bin-papier { background: #2563eb; color: #ffffff; }
    .bin-rest { background: #111827; color: #ffffff; }
    .bin-sonder { background: #ffffff; color: #1f2937; border: 1px solid #cbd5e1; }
    .table-wrap { width: 100%; overflow-x: auto; }
    table.trash-table { width: 100%; border-collapse: collapse; min-width: 520px; font-size: 0.92rem; }
    table.trash-table th { text-align: left; padding: 10px 10px; border-bottom: 2px solid var(--border); color: var(--muted); font-size: 0.82rem; font-weight: 700; white-space: nowrap; }
    table.trash-table td { padding: 10px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    table.trash-table tr:last-child td { border-bottom: none; }
    .th-type-filter { display: inline-flex; align-items: center; gap: 6px; }
    .th-type-filter select { padding: 4px 8px; font-size: 0.8rem; border-radius: 8px; min-width: 0; flex: none; font-weight: 600; color: var(--text); }
    .trash-date-text { font-weight: 600; white-space: nowrap; }
    .trash-note-sub { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
    .bulk-toolbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; }
    .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; }
    .cal-month-title { font-weight: 700; font-size: 0.96rem; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
    .cal-dow { font-size: 0.76rem; font-weight: 700; color: var(--muted); padding: 4px 0; text-align: center; }
    .cal-cell { min-height: 76px; border: 1px solid var(--border); border-radius: 8px; padding: 4px; background: #fff; display: flex; flex-direction: column; gap: 3px; overflow: hidden; }
    .cal-cell.empty { background: #f9fafb; border-color: transparent; }
    .cal-cell.is-today { border-color: var(--primary); background: #eff6ff; }
    .cal-day-num { font-size: 0.78rem; font-weight: 700; line-height: 1.1; padding: 0 2px; }
    .cal-pill { font-size: 0.69rem; font-weight: 700; line-height: 1.25; padding: 2px 5px; border-radius: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; text-align: left; }
    .cal-pill:hover { filter: brightness(0.95); }
    .cal-pill.is-done { text-decoration: line-through; opacity: 0.55; }
    .cal-pill-event { background: #ede9fe; color: #5b21b6; }
    .cal-pill-gcal { background: #d1fae5; color: #065f46; }
    .memo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; margin-top: 8px; }
    .memo-item { border: 1px solid var(--border); border-radius: 12px; padding: 12px; background: #fffbeb; border-color: #fde68a; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; }
    .memo-item.pinned { background: #fef3c7; border-color: #f59e0b; }
    .memo-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
    .memo-title { font-weight: 700; font-size: 0.94rem; color: #78350f; }
    .memo-body { font-size: 0.9rem; color: #1f2937; white-space: pre-wrap; word-break: break-word; line-height: 1.45; }
    .memo-foot { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: 4px; }
    .memo-time { font-size: 0.74rem; color: #92400e; }
    .memo-actions { display: flex; gap: 4px; }
    nav.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 4px; z-index: 30; }
    nav.bottom-nav button { background: none; border: none; color: var(--muted); font-size: 0.76rem; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; padding: 4px 8px; }
    nav.bottom-nav button.active { color: var(--primary); font-weight: 700; }
    nav.bottom-nav span.icon { font-size: 1.25rem; }
    .tab-page { display: none; }
    .tab-page.active { display: block; }
    .recipe-card { border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .recipe-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .recipe-title-btn { background: none; border: none; padding: 0; font: inherit; font-weight: 700; color: var(--text); cursor: pointer; text-align: left; display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .recipe-title-btn:hover { color: var(--primary); }
    .recipe-detail { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
    .recipe-ing { background: #f9fafb; padding: 10px; border-radius: 8px; font-size: 0.9rem; margin: 0 0 8px 0; white-space: pre-line; }
  </style>
</head>
<body>
<header>
  <div class="header-left">
    <h1 id="appTitle">Castor家小管家</h1>
    <span id="syncStatus" class="sync-badge">本機模式</span>
  </div>
  <div class="header-right">
    <div class="lang-switch">
      <button id="lang-zh" type="button" onclick="setLang('zh')">中文</button>
      <button id="lang-de" type="button" onclick="setLang('de')">DE</button>
    </div>
    <button id="authBtnTop" type="button" class="auth-btn primary" onclick="handleAuthClick()">Google 登入同步</button>
  </div>
</header>

<main>
  <section id="page-home" class="tab-page active">
    <div id="upcomingBanner" class="alert-banner" style="display:none;"></div>
    <div class="card">
      <h2 id="hHomeCalendar">近期行事曆（倒垃圾＋行程約診）</h2>
      <div id="homeTrashQuota"></div>
      <div id="homeCalendarBox"></div>
    </div>
    <div class="card">
      <h2 id="hHomeMemo">家庭備忘錄</h2>
      <div class="form-row">
        <input type="text" id="memoTitle" style="max-width:220px;" />
        <input type="text" id="memoText" onkeydown="handleMemoEnter(event)" />
        <button id="btnAddMemo" type="button" class="btn" onclick="addMemo()">新增</button>
      </div>
      <div id="homeMemoList"></div>
    </div>
  </section>

  <section id="page-events" class="tab-page">
    <div class="card">
      <h2 id="hAddEvent">新增行程 / 約診 / 約會</h2>
      <div class="form-row">
        <input type="date" id="evDate" />
        <input type="time" id="evTime" />
        <div class="who-picker-wrap" id="whoPickerWrap">
          <div class="who-box" onclick="focusWhoInput()">
            <div id="selectedWhoChips" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
            <input type="text" id="evWhoInput" class="who-input" autocomplete="off"
              onfocus="openWhoDropdown()" oninput="renderWhoDropdown()" onkeydown="handleWhoKeydown(event)" />
          </div>
          <div id="whoDropdown" class="dropdown-panel"></div>
        </div>
      </div>
      <div class="form-row">
        <input type="text" id="evTitle" />
        <input type="text" id="evNote" />
        <button id="btnAddEvent" type="button" class="btn" onclick="addEvent()">新增</button>
        <button id="btnCancelEditEvent" type="button" class="btn secondary" style="display:none;" onclick="cancelEditEvent()">取消</button>
      </div>
    </div>

    <div class="card">
      <h2>
        <span id="hGcalSources">Google 日曆來源（抓進來）</span>
        <button id="btnSyncGcal" type="button" class="btn sm" onclick="syncGoogleCalendars()">連接並同步 Google 日曆</button>
      </h2>
      <div id="pGcalHint" class="item-sub" style="margin-bottom:4px;"></div>
      <div id="pGcalLastSync" class="item-sub" style="margin-bottom:10px;font-weight:600;"></div>
      <div class="form-row">
        <input type="text" id="gcalLabel" style="max-width:190px;" />
        <input type="text" id="gcalId" />
        <button id="btnAddGcal" type="button" class="btn sm secondary" onclick="addGcalSource()">新增日曆</button>
      </div>
      <ul id="gcalSourceList" class="list"></ul>
    </div>

    <div class="card">
      <h2>
        <span id="hAllEvents">所有行程清單</span>
        <div class="row-actions">
          <button id="btnSelectAllEvents" type="button" class="btn sm secondary" onclick="toggleSelectAllFilteredEvents()">全選</button>
          <button id="btnBatchDelEvents" type="button" class="btn sm danger" onclick="batchDeleteEvents()">批次刪除已勾選</button>
          <button id="btnClearPastEvents" type="button" class="btn sm danger" onclick="clearPastEvents()">清除已過期</button>
        </div>
      </h2>
      <div class="form-row">
        <input type="text" id="evSearch" oninput="applyEventFilter()" onchange="applyEventFilter()" />
        <select id="evFilterWho" onchange="applyEventFilter()" style="max-width:210px;"></select>
        <button id="btnFilterEvents" type="button" class="btn sm" onclick="applyEventFilter()">篩選</button>
      </div>
      <ul id="eventList" class="list"></ul>
    </div>
  </section>

  <section id="page-trash" class="tab-page">
    <div class="card">
      <h2 id="hAddTrash">新增倒垃圾日期</h2>
      <div id="trashQuotaBox"></div>
      <div class="form-row">
        <input type="date" id="trDate" onchange="renderAll()" />
        <select id="trType"></select>
        <input type="text" id="trNote" />
        <button id="btnAddTrash" type="button" class="btn" onclick="addTrash()">新增</button>
      </div>
      <details style="margin-top:10px;">
        <summary id="sumBulkTrash" style="cursor:pointer; color:var(--primary); font-size:0.9rem; font-weight:600;">批次匯入多筆日期清單</summary>
        <p id="pBulkHint" style="font-size:0.84rem; color:var(--muted); margin:6px 0;"></p>
        <textarea id="trBulk"></textarea>
        <div class="bulk-toolbar">
          <select id="trBulkType" style="max-width:260px;"></select>
          <button id="btnBulkTrash" type="button" class="btn sm" onclick="bulkAddTrash()">批次匯入</button>
        </div>
      </details>
    </div>
    <div class="card">
      <h2>
        <span id="hTrashList">垃圾清運日曆清單</span>
        <button id="btnToggleHidePastTrash" type="button" class="btn sm secondary" onclick="toggleHidePastTrash()">隱藏已過期</button>
      </h2>
      <div id="trashList" class="table-wrap"></div>
    </div>
  </section>

  <section id="page-shop" class="tab-page">
    <div class="card">
      <h2 id="hAddShop">新增購物項目</h2>
      <div class="form-row">
        <div class="combo-wrap" id="shopCatPickerWrap">
          <input type="text" id="shCatInput" autocomplete="off"
            onfocus="openShopCatDropdown()" oninput="renderShopCatDropdown()" onkeydown="handleShopCatKeydown(event)" />
          <div id="shopCatDropdown" class="dropdown-panel"></div>
        </div>
        <input type="text" id="shName" onkeydown="handleShopEnter(event)" />
        <input type="text" id="shQty" style="max-width:140px;" onkeydown="handleShopEnter(event)" />
        <button id="btnAddShop" type="button" class="btn" onclick="addShop()">加入</button>
      </div>
    </div>
    <div class="card">
      <h2><span id="hShopList">採買清單</span> <button id="btnClearDoneShop" type="button" class="btn sm danger" onclick="clearDoneShop()">清除已買</button></h2>
      <div class="form-row">
        <select id="shFilterCat" onchange="renderAll()" style="max-width:220px;"></select>
      </div>
      <ul id="shopList" class="list"></ul>
    </div>
  </section>

  <section id="page-recipes" class="tab-page">
    <div class="card">
      <h2 id="hAddRecipe">新增家庭食譜</h2>
      <div class="form-row">
        <input type="text" id="rcTitle" />
        <div class="combo-wrap" id="rcTagPickerWrap">
          <input type="text" id="rcTag" autocomplete="off"
            onfocus="openRecipeTagDropdown()" oninput="renderRecipeTagDropdown()" onkeydown="handleRecipeTagKeydown(event)" />
          <div id="rcTagDropdown" class="dropdown-panel"></div>
        </div>
      </div>
      <div class="form-row"><textarea id="rcIng"></textarea></div>
      <div class="form-row"><textarea id="rcSteps"></textarea></div>
      <div class="row-actions">
        <button id="btnAddRecipe" type="button" class="btn" onclick="addRecipe()">儲存食譜</button>
        <button id="btnCancelEditRecipe" type="button" class="btn secondary" style="display:none;" onclick="cancelEditRecipe()">取消</button>
      </div>
    </div>
    <div class="card">
      <h2>
        <span id="hRecipeList">食譜清單</span>
        <div class="row-actions">
          <button id="btnExpandAllRecipes" type="button" class="btn sm secondary" onclick="toggleExpandAllRecipes(true)">全部展開</button>
          <button id="btnCollapseAllRecipes" type="button" class="btn sm secondary" onclick="toggleExpandAllRecipes(false)">全部收合</button>
        </div>
      </h2>
      <div class="form-row">
        <select id="rcFilterTag" onchange="renderAll()" style="max-width:220px;"></select>
        <input type="text" id="rcSearch" oninput="renderAll()" onchange="renderAll()" />
      </div>
      <div id="recipeList"></div>
    </div>
  </section>
</main>

<nav class="bottom-nav">
  <button id="nav-home" type="button" class="active" onclick="switchTab('home')"><span class="icon">🏠</span><span id="lblNavHome">總覽</span></button>
  <button id="nav-events" type="button" onclick="switchTab('events')"><span class="icon">📅</span><span id="lblNavEvents">行程約診</span></button>
  <button id="nav-trash" type="button" onclick="switchTab('trash')"><span class="icon">🗑️</span><span id="lblNavTrash">倒垃圾</span></button>
  <button id="nav-shop" type="button" onclick="switchTab('shop')"><span class="icon">🛒</span><span id="lblNavShop">購物清單</span></button>
  <button id="nav-recipes" type="button" onclick="switchTab('recipes')"><span class="icon">🍳</span><span id="lblNavRecipes">食譜</span></button>
</nav>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const GENERAL_WASTE_YEARLY_LIMIT = 4;
  const GCAL_SCOPE = "https://www.googleapis.com/auth/calendar.readonly";

  async function ensureGcalToken() {
    if (gcalAccessToken) return gcalAccessToken;
    const result = await signInWithPopup(auth, provider);
    const cred = GoogleAuthProvider.credentialFromResult(result);
    if (cred && cred.accessToken) {

    }
    throw new Error("Missing Google Calendar access token");
  }

  function parseGcalDateTime(dtObj) {
    if (!dtObj) return { date: "", time: "" };
    if (dtObj.date) {
      return { date: dtObj.date, time: "" };
    }
    if (dtObj.dateTime) {
      const d = new Date(dtObj.dateTime);
      if (!isNaN(d.getTime())) {
        const pad = function(n) { return n < 10 ? "0" + n : String(n); };
        return {
          date: d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()),
          time: pad(d.getHours()) + ":" + pad(d.getMinutes())
        };
      }
      const parts = String(dtObj.dateTime).split("T");
      return { date: parts[0] || "", time: (parts[1] || "").slice(0, 5) };
    }
    return { date: "", time: "" };
  }

  async function fetchCalendarMetadata(token, calendarId) {
    const encodedCalId = encodeURIComponent(calendarId || "primary");
    try {
      const res = await fetch("https://www.googleapis.com/calendar/v3/calendars/" + encodedCalId, {
        headers: { Authorization: "Bearer " + token }
      });
      if (!res.ok) return null;
      return await res.json();
    } catch (_) {
      return null;
    }
  }

  async function fetchUpcomingEventsForCalendar(token, source) {
    const rawCalId = (source.calendarId || "primary").trim();
    const encodedCalId = encodeURIComponent(rawCalId);
    const meta = await fetchCalendarMetadata(token, rawCalId);
    const calSummary = (meta && meta.summary) ? String(meta.summary).trim() : "";
    const calIdFromMeta = (meta && meta.id) ? String(meta.id).trim() : "";
    const loginEmail = (currentUser && currentUser.email) ? String(currentUser.email).trim() : "";

    let accountLabel = rawCalId;
    if (rawCalId === "primary") {
      accountLabel = calIdFromMeta || loginEmail || "primary";
    } else if (calIdFromMeta && calIdFromMeta !== rawCalId) {
      accountLabel = rawCalId + " (" + calIdFromMeta + ")";
    }

    let sourceLabel = (source.label || "").trim();
    if (!sourceLabel || sourceLabel === "我的主日曆" || sourceLabel === "Mein Kalender") {
      sourceLabel = calSummary || accountLabel || "Google 日曆";
    }
    source.resolvedAccount = accountLabel;
    source.resolvedSummary = calSummary;

    const now = new Date();
    now.setHours(0, 0, 0, 0);
    const oneYearLater = new Date(now);
    oneYearLater.setFullYear(oneYearLater.getFullYear() + 1);
    oneYearLater.setHours(23, 59, 59, 999);

    const timeMinIso = encodeURIComponent(now.toISOString());
    const timeMaxIso = encodeURIComponent(oneYearLater.toISOString());
    let pageToken = "";
    const collected = [];
    let guard = 0;

    do {
      guard++;
      const url = "https://www.googleapis.com/calendar/v3/calendars/" + encodedCalId +
        "/events?singleEvents=true&timeMin=" + timeMinIso + "&timeMax=" + timeMaxIso + "&maxResults=2500" +
        (pageToken ? "&pageToken=" + encodeURIComponent(pageToken) : "");
      const res = await fetch(url, {
        headers: { Authorization: "Bearer " + token }
      });
      const data = await res.json();
      if (!res.ok) {
        const msg = (data && data.error && data.error.message) || ("HTTP " + res.status);
        throw new Error(sourceLabel + " (" + rawCalId + "): " + msg);
      }
      (data.items || []).forEach(function(item, idx) {
        if (item.status === "cancelled") return;
        const dt = parseGcalDateTime(item.start);
        const diff = dt.date ? dayDiff(dt.date) : -1;
        if (!dt.date || diff < 0 || diff > 366) return;
        const cleanTitle = (item.summary || "(No title)").trim();
        collected.push({
          id: "gcal_" + rawCalId + "_" + (item.id || idx) + "_" + dt.date + "_" + (dt.time || "allday"),
          sourceId: source.id,
          sourceLabel: sourceLabel,
          accountLabel: accountLabel,
          calendarId: rawCalId,
          date: dt.date,
          time: dt.time,
          title: cleanTitle,
          note: item.location || item.description || "",
          isGcal: true
        });
      });
      pageToken = data.nextPageToken || "";
    } while (pageToken && guard < 40);

    return collected;
  }

  function dedupeGcalEvents(items) {
    const seenKeys = new Set();
    const out = [];
    (items || []).forEach(function(ev) {
      const contentKey = [
        (ev.accountLabel || ev.calendarId || "").toLowerCase().trim(),
        (ev.date || "").trim(),
        (ev.time || "").trim(),
        (ev.title || "").toLowerCase().trim()
      ].join("|");
      const idKey = String(ev.id || "").trim();
      if (seenKeys.has(contentKey) || (idKey && seenKeys.has("ID:" + idKey))) return;
      seenKeys.add(contentKey);
      if (idKey) seenKeys.add("ID:" + idKey);
      out.push(ev);
    });
    return out;
  }

  window.syncGoogleCalendars = async function() {
    const t = I18N[curLang];
    const btn = document.getElementById("btnSyncGcal");
    const origText = btn ? btn.textContent : "";
    try {
      if (btn) {
        btn.disabled = true;

      const token = await ensureGcalToken();
      const sources = state.gcalSources && state.gcalSources.length
        ? state.gcalSources
        : [{ id: "primary", label: t.gcalBadge, calendarId: "primary", resolvedAccount: "" }];

      const allFetched = [];
      for (let i = 0; i < sources.length; i++) {
        const rows = await fetchUpcomingEventsForCalendar(token, sources[i]);
        rows.forEach(function(r) { allFetched.push(r); });
      }
      const deduped = dedupeGcalEvents(allFetched).sort(function(a, b) {
        return ((a.date || "") + (a.time || "")).localeCompare((b.date || "") + (b.time || ""));
      });
      const stamp = nowDisplayStamp();
      saveGcalCache(deduped, stamp);

      if (e && e.code === "auth/popup-closed-by-user") return;

  function isGeneralWaste(type) {
    const s = (type || "").toLowerCase();
    return s.indexOf("一般垃圾") !== -1 || s.indexOf("restmuell") !== -1 || s.indexOf("restmüll") !== -1;
  }
  function binKey(type) {
    const s = (type || "").toLowerCase();
    if (s.indexOf("bio") !== -1 || s.indexOf("綠") !== -1) return "bio";
    if (s.indexOf("gelb") !== -1 || s.indexOf("黃") !== -1) return "gelb";
    if (s.indexOf("papier") !== -1 || s.indexOf("藍") !== -1) return "papier";
    if (s.indexOf("sonder") !== -1) return "sonder";
    return "rest";
  }
  function shortBinLabel(type, t) {
    const k = binKey(type);
    if (k === "bio") return t.shortBio;
    if (k === "gelb") return t.shortGelb;
    if (k === "papier") return t.shortPapier;
    if (k === "sonder") return t.shortSonder;
    return t.shortRest;
  }
  function binBadge(type) {
    return '<span class="bin-badge bin-' + binKey(type) + '">' + esc(type) + '</span>';
  }
  function parseBulkDate(rawLine) {
    const cleaned = String(rawLine || "").split("*").join("").trim();
    const m = cleaned.match(/^(\d{1,2})[\s./-]+(\d{1,2})[\s./-]+(\d{4})$/);
    if (!m) return null;
    const dd = Number(m[1]);
    const mm = Number(m[2]);
    const yyyy = Number(m[3]);
    if (mm < 1 || mm > 12 || dd < 1 || dd > 31) return null;
    const dt = new Date(yyyy, mm - 1, dd);
    if (dt.getFullYear() !== yyyy || dt.getMonth() !== mm - 1 || dt.getDate() !== dd) return null;
    const pad = function(n) { return n < 10 ? "0" + n : String(n); };
    return yyyy + "-" + pad(mm) + "-" + pad(dd);
  }
  function getWasteStats(year) {
    const y = year || String(new Date().getFullYear());
    const used = state.trash.filter(function(tr) {
      return tr.done && isGeneralWaste(tr.type) && String(tr.date || "").indexOf(y) === 0;
    }).length;
    return { year: y, used: used, limit: GENERAL_WASTE_YEARLY_LIMIT, left: GENERAL_WASTE_YEARLY_LIMIT - used };
  }
  function renderQuota(stats, compact) {
    const t = I18N[curLang];
    const cls = stats.used > stats.limit ? "quota-box over" : (stats.used >= stats.limit ? "quota-box warn" : "quota-box");
    const extra = stats.used >= stats.limit
      ? '<div style="margin-top:4px;font-size:0.8rem;">' + esc(t.quotaFullWarning(stats.year, stats.limit)) + '</div>'
      : "";
    const styleAttr = compact ? ' style="padding:7px 10px;font-size:0.82rem;margin-bottom:10px;"' : "";
    return '<div class="' + cls + '"' + styleAttr + '>' + esc(t.quotaText(stats.year, stats.used, stats.limit, Math.max(0, stats.left))) + extra + '</div>';
  }
  function dayDiff(dateStr) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    return Math.round((new Date(dateStr + "T00:00:00") - today) / 86400000);
  }
  function dayBadge(dateStr) {
    const t = I18N[curLang];
    const d = dayDiff(dateStr);
    if (d === 0) return '<span class="tag tag-today">' + esc(t.today) + '</span>';
    if (d === 1) return '<span class="tag tag-tomorrow">' + esc(t.tomorrow) + '</span>';
    if (d > 1) return '<span class="tag tag-future">' + esc(t.inDays(d)) + '</span>';
    return '<span class="tag tag-cat">' + esc(t.expired) + '</span>';
  }

          '</div>' +
          '<div class="memo-foot">' +
            '<span class="memo-time">' + esc(m.updatedAt || "") + '</span>' +
            '<div class="memo-actions">' +
              '<button type="button" class="btn sm secondary" onclick="togglePinMemo(' + m.id + ')">' + esc(pinLabel) + '</button>' +
              '<button type="button" class="btn sm secondary" onclick="editMemo(' + m.id + ')">' + esc(t.memoEdit) + '</button>' +
              '<button type="button" class="btn sm danger" onclick="delMemo(' + m.id + ')">' + esc(t.btnDel) + '</button>' +
            '</div>' +
          '</div>' +
        '</div>'
      );
    });
    box.innerHTML = '<div class="memo-grid">' + cards.join("") + '</div>';
  }

  function renderGcalSources(t) {
    renderGcalLastSyncText(t);
    const ul = document.getElementById("gcalSourceList");
    if (!ul) return;
    const sources = state.gcalSources || [];
    if (!sources.length) {
      ul.innerHTML = '<li class="item-sub">' + esc(t.pGcalHint) + '</li>';
      return;
    }
    const rows = sources.map(function(s) {
      const accText = (s.resolvedAccount && s.resolvedAccount !== s.calendarId)
        ? (s.calendarId + " · " + s.resolvedAccount)
        : (s.resolvedAccount || s.calendarId);
      return (
        '<li>' +
          '<div class="item-main">' +
            '<div class="item-title"><span class="tag tag-gcal">' + esc(t.gcalBadge) + '</span>' + esc(s.label) + '</div>' +
            '<div class="item-sub">' + esc(accText) + '</div>' +
          '</div>' +
          '<button type="button" class="btn sm danger" onclick="delGcalSource(\'' + esc(s.id) + '\')">' + esc(t.btnDel) + '</button>' +
        '</li>'
      );
    });
    ul.innerHTML = rows.join("");
  }

  function applyTranslations() {
    const t = I18N[curLang];
    document.getElementById("lang-zh").classList.toggle("active", curLang === "zh");
    document.getElementById("lang-de").classList.toggle("active", curLang === "de");
    document.getElementById("appTitle").textContent = t.appTitle;
    document.getElementById("lblNavHome").textContent = t.navHome;
    document.getElementById("lblNavEvents").textContent = t.navEvents;
    document.getElementById("lblNavTrash").textContent = t.navTrash;
    document.getElementById("lblNavShop").textContent = t.navShop;
    document.getElementById("lblNavRecipes").textContent = t.navRecipes;

    const navIcons = {
      "nav-home": "🏠",
      "nav-events": "📅",
      "nav-trash": "🗑️",
      "nav-shop": "🛒",
      "nav-recipes": "🍳"
    };
    Object.keys(navIcons).forEach(function(btnId) {
      const iconEl = document.querySelector("#" + btnId + " .icon");
      if (iconEl) iconEl.textContent = navIcons[btnId];
    });

    document.getElementById("hHomeCalendar").textContent = t.hHomeCalendar;
    document.getElementById("hHomeMemo").textContent = t.hHomeMemo;
    document.getElementById("memoTitle").placeholder = t.memoTitlePh;
    document.getElementById("memoText").placeholder = t.memoTextPh;
    document.getElementById("btnAddMemo").textContent = t.btnAdd;

    syncEventFormMode();
    document.getElementById("hAllEvents").textContent = t.hAllEvents;
    document.getElementById("btnFilterEvents").textContent = t.btnFilter;
    document.getElementById("btnBatchDelEvents").textContent = t.btnBatchDel;
    document.getElementById("btnClearPastEvents").textContent = t.btnClearPast;
    updateSelectAllButtonLabel();
    document.getElementById("hGcalSources").textContent = t.hGcalSources;
    document.getElementById("btnSyncGcal").textContent = t.btnSyncGcal;
    document.getElementById("btnAddGcal").textContent = t.btnAddGcal;
    document.getElementById("pGcalHint").textContent = t.pGcalHint;
    renderGcalLastSyncText(t);
    document.getElementById("gcalLabel").placeholder = t.gcalLabelPh;
    document.getElementById("gcalId").placeholder = t.gcalIdPh;

    document.getElementById("evWhoInput").placeholder = t.whoInputPh;
    document.getElementById("evSearch").placeholder = t.evSearchPh;
    document.getElementById("evTitle").placeholder = t.evTitlePh;
    document.getElementById("evNote").placeholder = t.evNotePh;
    document.getElementById("hAddTrash").textContent = t.hAddTrash;
    document.getElementById("hTrashList").textContent = t.hTrashList;
    syncHidePastTrashBtn();
    document.getElementById("trNote").placeholder = t.trNotePh;
    document.getElementById("btnAddTrash").textContent = t.btnAdd;
    document.getElementById("sumBulkTrash").textContent = t.sumBulkTrash;
    document.getElementById("pBulkHint").textContent = t.pBulkHint;
    document.getElementById("trBulk").placeholder = t.trBulkPh;
    document.getElementById("btnBulkTrash").textContent = t.btnBulkTrash;
    const trOpts = [];
    t.trashTypes.forEach(function(c) { trOpts.push('<option value="' + esc(c) + '">' + esc(c) + '</option>'); });
    const trOptsHtml = trOpts.join("");
    const trTypeEl = document.getElementById("trType");
    const trBulkTypeEl = document.getElementById("trBulkType");
    const prevTypeIdx = trTypeEl.selectedIndex >= 0 ? trTypeEl.selectedIndex : 0;
    const prevBulkIdx = trBulkTypeEl.selectedIndex >= 0 ? trBulkTypeEl.selectedIndex : 0;
    trTypeEl.innerHTML = trOptsHtml;
    trBulkTypeEl.innerHTML = trOptsHtml;
    trTypeEl.selectedIndex = Math.min(prevTypeIdx, t.trashTypes.length - 1);
    trBulkTypeEl.selectedIndex = Math.min(prevBulkIdx, t.trashTypes.length - 1);

    document.getElementById("hAddShop").textContent = t.hAddShop;
    document.getElementById("hShopList").textContent = t.hShopList;
    const catInp = document.getElementById("shCatInput");
    catInp.placeholder = t.shCatPh;
    const firstDefaultCat = (t.defaultShopCats && t.defaultShopCats[0]) || "";
    if (!catInp.value || ALL_DEFAULT_CATS.indexOf(catInp.value.trim()) !== -1) {
      catInp.value = firstDefaultCat;
    }
    document.getElementById("shName").placeholder = t.shNamePh;
    document.getElementById("shQty").placeholder = t.shQtyPh;
    document.getElementById("btnAddShop").textContent = t.btnJoin;
    document.getElementById("btnClearDoneShop").textContent = t.btnClearDone;
    syncRecipeFormMode();
    document.getElementById("hRecipeList").textContent = t.hRecipeList;
    document.getElementById("btnExpandAllRecipes").textContent = t.btnExpandAll;
    document.getElementById("btnCollapseAllRecipes").textContent = t.btnCollapseAll;
    document.getElementById("rcTitle").placeholder = t.rcTitlePh;
    document.getElementById("rcTag").placeholder = t.rcTagPh;
    document.getElementById("rcIng").placeholder = t.rcIngPh;
    document.getElementById("rcSteps").placeholder = t.rcStepsPh;
    document.getElementById("rcSearch").placeholder = t.rcSearchPh;
    updateAuthUI();
    refreshWhoFilter();
    refreshShopCatFilter();
    refreshRecipeTagFilter();
    renderChips();
  }

  function buildTrashTypeFilterHtml(t) {
    const opts = getTrashFilterOptions(t);
    const matched = opts.some(function(c) { return c.toLowerCase() === selectedTrashFilter.toLowerCase(); });
    if (!matched) selectedTrashFilter = "__ALL__";
    const items = ['<option value="__ALL__"' + (selectedTrashFilter === "__ALL__" ? " selected" : "") + '>' + esc(t.filterAllTrashType) + '</option>'];
    opts.forEach(function(c) {
      const isSel = selectedTrashFilter.toLowerCase() === c.toLowerCase();
      items.push('<option value="' + esc(c) + '"' + (isSel ? " selected" : "") + '>' + esc(c) + '</option>');
    });
    return '<span class="th-type-filter"><span>' + esc(t.colType) + '</span><select id="trFilterType" onchange="onTrashTypeFilterChange(this)">' + items.join("") + '</select></span>';
  }

  function matchesWhoFilter(ev, fWho) {
    if (!fWho || fWho === "__ALL__") return true;
    const target = fWho.trim().toLowerCase();
    const wl = (ev.whoList || []).map(function(w) { return String(w || "").trim().toLowerCase(); });
    if (wl.indexOf(target) !== -1) return true;
    const titleStr = String(ev.title || "").toLowerCase();
    const srcStr = String(ev.sourceLabel || "").toLowerCase();
    const accStr = String(ev.accountLabel || ev.calendarId || "").toLowerCase();
    return titleStr.indexOf(target) !== -1 || srcStr.indexOf(target) !== -1 || accStr.indexOf(target) !== -1;
  }

  function renderAll() {
    const t = I18N[curLang];
    refreshWhoFilter();
    refreshShopCatFilter();
    refreshRecipeTagFilter();
    renderGcalSources(t);
    syncHidePastTrashBtn();

    renderUpcomingBanner(t);

    const trDateVal = document.getElementById("trDate").value;
    const y = (trDateVal && trDateVal.slice(0, 4)) || String(new Date().getFullYear());
    document.getElementById("trashQuotaBox").innerHTML = renderQuota(getWasteStats(y), false);
    document.getElementById("homeTrashQuota").innerHTML = renderQuota(getWasteStats(String(new Date().getFullYear())), true);

    renderHomeCalendar(t);
    renderHomeMemos(t);

    const kw = document.getElementById("evSearch").value.trim().toLowerCase();
    const fWho = document.getElementById("evFilterWho").value;
    const evs = getCombinedEvents().filter(function(e) {
      const wl = e.whoList || [];
      const srcLabel = formatGcalSourceTag(e);
      const whoOk = matchesWhoFilter(e, fWho);
      const kwOk = !kw || [e.title, wl.join(" "), srcLabel, e.note, e.date].join(" ").toLowerCase().indexOf(kw) !== -1;
      return whoOk && kwOk;
    });
    lastFilteredEventKeys = evs.map(function(e) { return getEventRowKey(e, !!e.isGcal); });
    updateSelectAllButtonLabel();

    function whoTags(e) {
      const out = [];
      if (e.isGcal) {
        out.push('<span class="tag tag-gcal">' + esc(t.gcalBadge) + '</span>');
        out.push('<span class="tag tag-src">[' + esc(formatGcalSourceTag(e)) + ']</span>');
      }
      (e.whoList || []).forEach(function(w) { out.push('<span class="tag tag-who">' + esc(w) + '</span>'); });
      return out.join("");
    }
    const evRows = [];
    evs.forEach(function(e) {
      const rowKey = getEventRowKey(e, !!e.isGcal);
      const isChecked = selectedEventKeys.has(rowKey) ? "checked" : "";
      const metaParts = [esc(e.date) + " " + esc(e.time || "")];
      if (e.isGcal && e.accountLabel) {
        metaParts.push(esc(e.accountLabel));
      } else if (e.isGcal && e.calendarId) {
        metaParts.push(esc(e.calendarId));
      }
      if (e.note) metaParts.push(esc(e.note));
      const sub = metaParts.join(" | ");
      const actionsHtml = e.isGcal
        ? '<div class="row-actions">' +
            '<button type="button" class="btn sm danger" onclick="delGcalEvent(\'' + esc(e.id) + '\')">' + esc(t.btnDel) + '</button>' +
          '</div>'
        : '<div class="row-actions">' +
            '<button type="button" class="btn sm secondary" onclick="editEvent(\'' + esc(e.id) + '\')">' + esc(t.btnEdit) + '</button>' +
            '<button type="button" class="btn sm danger" onclick="delEvent(\'' + esc(e.id) + '\')">' + esc(t.btnDel) + '</button>' +
          '</div>';
      evRows.push(
        '<li>' +
          '<input type="checkbox" class="ev-check" ' + isChecked + ' onchange="toggleEventSelect(\'' + esc(rowKey) + '\', this.checked)" />' +
          '<div class="item-main"><div class="item-title">' + dayBadge(e.date) + whoTags(e) + esc(e.title) + '</div><div class="item-sub">' + sub + '</div></div>' +
          actionsHtml +
        '</li>'
      );
    });
    document.getElementById("eventList").innerHTML = evRows.length ? evRows.join("") : '<li class="item-sub">' + esc(t.emptyEvents) + '</li>';

    const typeHeaderHtml = buildTrashTypeFilterHtml(t);
    if (!state.trash.length) {
      document.getElementById("trashList").innerHTML =
        '<table class="trash-table"><thead><tr>' +
          '<th>' + esc(t.colDate) + '</th>' +
          '<th>' + typeHeaderHtml + '</th>' +
          '<th>' + esc(t.colExpired) + '</th>' +
          '<th>' + esc(t.colDone) + '</th>' +
          '<th>' + esc(t.colAction) + '</th>' +
        '</tr></thead><tbody><tr><td colspan="5" class="item-sub">' + esc(t.emptyTrash) + '</td></tr></tbody></table>';
    } else {
      const filteredTrash = state.trash.filter(function(tr) {
        if (hidePastTrash && tr.date && dayDiff(tr.date) < 0) return false;
        if (selectedTrashFilter === "__ALL__") return true;
        return String(tr.type || "").trim().toLowerCase() === selectedTrashFilter.trim().toLowerCase();
      });
      const trBodyRows = [];
      filteredTrash.forEach(function(tr) {
        const chk = tr.done ? "checked" : "";
        const noteHtml = tr.note ? '<div class="trash-note-sub">' + esc(tr.note) + '</div>' : "";
        trBodyRows.push(
          '<tr class="' + (tr.done ? "done" : "") + '">' +
            '<td><div class="trash-date-text">' + esc(tr.date) + '</div>' + noteHtml + '</td>' +
            '<td>' + binBadge(tr.type) + '</td>' +
            '<td>' + dayBadge(tr.date) + '</td>' +
            '<td><label class="check-label"><input type="checkbox" ' + chk + ' onchange="toggleTrashDone(' + tr.id + ')" /><span>' + esc(t.checkedTrash) + '</span></label></td>' +
            '<td><button type="button" class="btn sm danger" onclick="delTrash(' + tr.id + ')">' + esc(t.btnDel) + '</button></td>' +
          '</tr>'
        );
      });
      const bodyContent = trBodyRows.length
        ? trBodyRows.join("")
        : '<tr><td colspan="5" class="item-sub">' + esc(t.emptyTrash) + '</td></tr>';
      document.getElementById("trashList").innerHTML =
        '<table class="trash-table"><thead><tr>' +
          '<th>' + esc(t.colDate) + '</th>' +
          '<th>' + typeHeaderHtml + '</th>' +
          '<th>' + esc(t.colExpired) + '</th>' +
          '<th>' + esc(t.colDone) + '</th>' +
          '<th>' + esc(t.colAction) + '</th>' +
        '</tr></thead><tbody>' + bodyContent + '</tbody></table>';
    }

    const fCat = document.getElementById("shFilterCat").value;
    const shList = state.shop.filter(function(s) { return fCat === "__ALL__" || (s.cat || "").trim() === fCat; });
    function fmtShop(s) {
      return esc(s.name) + (s.qty ? '<span class="qty-badge">' + esc(s.qty) + '</span>' : "");
    }
    const shRows = [];
    shList.forEach(function(s) {
      const icon = s.done ? "✅" : "⬜";
      shRows.push('<li class="' + (s.done ? "done" : "") + '"><div class="item-main" style="cursor:pointer;" onclick="toggleShop(' + s.id + ')"><div class="item-title">' + icon + ' <span class="tag tag-cat">' + esc(s.cat) + '</span>' + fmtShop(s) + '</div></div><button type="button" class="btn sm danger" onclick="delShop(' + s.id + ')">' + esc(t.btnDel) + '</button></li>');
    });
    document.getElementById("shopList").innerHTML = shRows.length ? shRows.join("") : '<li class="item-sub">' + esc(t.emptyShop) + '</li>';

    const fRecipeTag = document.getElementById("rcFilterTag").value;
    const recipeKw = document.getElementById("rcSearch").value.trim().toLowerCase();
    const filteredRecipes = (state.recipes || []).filter(function(r) {
      const rTag = String(r.tag || "").trim();
      const tagOk = !fRecipeTag || fRecipeTag === "__ALL__" || rTag.toLowerCase() === fRecipeTag.trim().toLowerCase();
      const kwOk = !recipeKw || [r.title, rTag, r.ing, r.steps].join(" ").toLowerCase().indexOf(recipeKw) !== -1;
      return tagOk && kwOk;
    });

    const rcRows = [];
    filteredRecipes.forEach(function(r) {
      const isOpen = expandedRecipeIds.has(String(r.id));
      const ingBox = r.ing ? '<div class="recipe-ing"><strong>' + esc(t.ingLabel) + '</strong>\n' + esc(r.ing) + '</div>' : "";
      const stepBox = r.steps ? '<div style="font-size:0.92rem;white-space:pre-line;line-height:1.5;"><strong>' + esc(t.stepsLabel) + '</strong>\n' + esc(r.steps) + '</div>' : "";
      const detailHtml = isOpen
        ? '<div class="recipe-detail">' + ingBox + stepBox + '</div>'
        : "";
      rcRows.push(
        '<div class="card recipe-card">' +
          '<div class="recipe-head">' +
            '<button type="button" class="recipe-title-btn" onclick="toggleRecipeExpand(\'' + esc(r.id) + '\')">' +
              '<span>' + (isOpen ? "▾" : "▸") + ' 🍳 ' + esc(r.title) + '</span>' +
              '<span class="tag tag-cat">' + esc(r.tag) + '</span>' +
            '</button>' +
            '<div class="row-actions">' +
              '<button type="button" class="btn sm secondary" onclick="toggleRecipeExpand(\'' + esc(r.id) + '\')">' + esc(isOpen ? t.btnCollapse : t.btnExpand) + '</button>' +
              '<button type="button" class="btn sm secondary" onclick="editRecipe(\'' + esc(r.id) + '\')">' + esc(t.btnEdit) + '</button>' +
              '<button type="button" class="btn sm danger" onclick="delRecipe(\'' + esc(r.id) + '\')">' + esc(t.btnDel) + '</button>' +
            '</div>' +
          '</div>' +
          detailHtml +
        '</div>'
      );
    });
    const emptyRecipeMsg = !(state.recipes || []).length ? t.emptyRecipes : t.emptyFilteredRecipes;
    document.getElementById("recipeList").innerHTML = rcRows.length ? rcRows.join("") : '<div class="card item-sub">' + esc(emptyRecipeMsg) + '</div>';
  }

  applyTranslations();
  renderAll();
</script>
</body>
</html>
